<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchMaker - Emparejamiento por Respuestas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Giliprush 💘</h1>

    <!-- Formulario de Registro y Cuestionario -->
    <div id="quiz-section" class="card">
      <h2>Completa tu Perfil</h2>

      <!-- Nombre -->
      <div class="age-block">
        <label for="username"><b>Tu nombre:</b></label>
        <input type="text" id="username" placeholder="Escribe tu nombre" required>
      </div>

      <!-- Edad del usuario -->
      <div class="age-block">
        <label for="user-age"><b>Tu edad:</b></label>
        <input type="number" id="user-age" min="18" max="99" placeholder="Ej. 25" required>
      </div>

      <!-- Rango de edad buscado -->
      <div class="age-block">
        <label><b>Rango de edad que te interesa:</b></label>
        <div class="range-inputs">
          <input type="number" id="min-age" min="18" max="99" placeholder="Mín (ej. 20)" required>
          <span>a</span>
          <input type="number" id="max-age" min="18" max="99" placeholder="Máx (ej. 30)" required>
        </div>
      </div>
      
      <!-- Contenedor donde se insertan las preguntas de app.js -->
      <div id="questions-container"></div>
      
      <button id="submit-btn" onclick="guardarYEmparejar()">Guardar y Buscar Matches</button>
    </div>

    <!-- Resultados de Emparejamiento -->
    <div id="results-section" class="card hidden">
      <h2>Tus Compatibilidades</h2>
      <div id="matches-list"></div>
      <button onclick="reiniciar()">Volver al cuestionario</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crush & Gilicrush 🖤</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Crush & Gilicrush 🖤</h1>

    <!-- Selector de Modo -->
   <div id="mode-selector" class="card">
  <h2>¿Qué quieres hacer?</h2>
  <button id="btn-ir-quiz">Hacer el Test / Crear Perfil</button>
  <button id="btn-ir-login" class="secondary-btn">Consultar mi Buzón (PIN)</button>
</div>

    <!-- Formulario de Registro y Cuestionario -->
    <div id="quiz-section" class="card hidden">
      <h2>Completa tu Perfil</h2>

      <div class="age-block">
        <label for="username"><b>Tu nombre:</b></label>
        <input type="text" id="username" placeholder="Escribe tu nombre" required>
      </div>

      <div class="age-block">
        <label for="user-pin"><b>Crea un PIN secreto (4 dígitos):</b></label>
        <input type="password" id="user-pin" maxlength="4" placeholder="Ej. 1234" required>
      </div>

      <div class="age-block">
        <label for="user-age"><b>Tu edad:</b></label>
        <input type="number" id="user-age" min="18" max="99" placeholder="Ej. 25" required>
      </div>

      <div class="age-block">
        <label><b>Rango de edad que te interesa:</b></label>
        <div class="range-inputs">
          <input type="number" id="min-age" min="18" max="99" placeholder="Mín" required>
          <span>a</span>
          <input type="number" id="max-age" min="18" max="99" placeholder="Máx" required>
        </div>
      </div>
      <!-- SECCIÓN DE GÉNERO E INTERÉS -->
<div class="gender-section" style="margin: 20px 0; text-align: left; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155;">
  <!-- Género del usuario -->
  <p style="color: #ffffff; font-weight: bold; margin-bottom: 8px;">¿Con qué género te identificas?</p>
  <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px;">
    <label style="color: #e2e8f0; cursor: pointer;"><input type="radio" name="user-gender" value="no_binario"> No binario</label>
    <label style="color: #e2e8f0; cursor: pointer;"><input type="radio" name="user-gender" value="femenino"> Femenino</label>
    <label style="color: #e2e8f0; cursor: pointer;"><input type="radio" name="user-gender" value="masculino"> Masculino</label>
  </div>

  <!-- Género de interés (Checkboxes) -->
  <p style="color: #ffffff; font-weight: bold; margin-bottom: 8px;">¿En qué género estás interesado/a? <small style="color:#94a3b8;">(Puedes elegir varios)</small></p>
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <label style="color: #e2e8f0; cursor: pointer;"><input type="checkbox" id="gen-interest-todos" value="todos" onchange="window.toggleInteresTodos(this)"> Todos</label>
    <label style="color: #e2e8f0; cursor: pointer;"><input type="checkbox" class="gen-interest-item" value="no_binario"> No binario</label>
    <label style="color: #e2e8f0; cursor: pointer;"><input type="checkbox" class="gen-interest-item" value="femenino"> Femenino</label>
    <label style="color: #e2e8f0; cursor: pointer;"><input type="checkbox" class="gen-interest-item" value="masculino"> Masculino</label>
  </div>
</div>
      <div id="questions-container"></div>
      
      <button id="submit-btn" onclick="guardarYEmparejar()">Guardar y Buscar Matches</button>
      <button onclick="mostrarSeccion('mode-selector')" class="cancel-btn">Volver</button>
    </div>

    <!-- Acceso al Buzón -->
    <div id="login-section" class="card hidden">
  <h2>Consulta tu Buzón</h2>
  <div class="age-block">
    <label for="login-name"><b>Tu nombre registrado:</b></label>
    <input type="text" id="login-name" placeholder="Tu nombre">
  </div>
  <div class="age-block">
    <label for="login-pin"><b>Tu PIN (4 dígitos):</b></label>
    <input type="password" id="login-pin" maxlength="4" placeholder="****">
  </div>
  <button id="btn-entrar-buzon">Entrar a mi Buzón</button>
  <button id="btn-volver-selector" class="cancel-btn">Volver</button>
</div>

    <!-- Buzón Privado de Notificaciones -->
    <div id="mailbox-section" class="card hidden">
      <h2>Sala de Chat </h2>
      <div id="notifications-list"></div>
      <button onclick="mostrarSeccion('mode-selector')">Volver al inicio</button>
    </div>

    <!-- Resultados de Emparejamiento -->
    <div id="results-section" class="card hidden">
       <h2 style="display: flex; align-items: center; gap: 8px;">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Persona 1 (Fondo) -->
    <path d="M14.5 12C15.8807 12 17 10.8807 17 9.5C17 8.11929 15.8807 7 14.5 7C13.1193 7 12 8.11929 12 9.5C12 10.8807 13.1193 12 14.5 12Z" fill="#888888"/>
    <path d="M14.5 13.5C12.43 13.5 8.5 14.53 8.5 16.6V18H20.5V16.6C20.5 14.53 16.57 13.5 14.5 13.5Z" fill="#888888"/>
    
    <!-- Persona 2 (Frente) -->
    <path d="M7.5 11C8.88071 11 10 9.88071 10 8.5C10 7.11929 8.88071 6 7.5 6C6.11929 6 5 7.11929 5 8.5C5 9.88071 6.11929 11 7.5 11Z" fill="#888888"/>
    <path d="M7.5 12.5C5.43 12.5 1.5 13.53 1.5 15.6V17H13.5V15.6C13.5 13.53 9.57 12.5 7.5 12.5Z" fill="#888888"/>
    
    <!-- Punto Rojo (Notificación) -->
    <circle cx="18.5" cy="5.5" r="3.5" fill="#EF4444"/>
  </svg>
  ¡Tus Matches Encontrados!
</h2>
      <div id="matches-list"></div>
      <button onclick="mostrarSeccion('mode-selector')">Volver al inicio</button>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
